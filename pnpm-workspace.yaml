packages:
  - "apps/*"

allowBuilds:
  '@google/genai': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - "@google/genai"
  - esbuild
  - protobufjs
  - better-sqlite3
